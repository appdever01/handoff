name: handoff
services:
  api:
    image: handoff-api:${HANDOFF_RELEASE:-preview}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      HANDOFF_RELEASE_STAGE: ${HANDOFF_RELEASE_STAGE:-preview}
      APP_ORIGIN: ${HANDOFF_ORIGIN:?Set the public HTTPS origin}
      LISTEN_HOST: 0.0.0.0
      PORT: "4003"
      DATA_DIR: /data
      HANDOFF_SANDBOX: "0"
      CLAMAV_HOST: scanner
      CLAMAV_PORT: "3310"
      PREVIEW_WORKER_URL: http://preview-worker:4004
      PREVIEW_WORKER_SECRET_FILE: /run/secrets/preview_worker_secret
      TESTNET_PAYMENTS: ${TESTNET_PAYMENTS:-0}
      NIMIQ_TESTNET_RPC: ${NIMIQ_TESTNET_RPC:-}
      POLYGON_AMOY_RPC: ${POLYGON_AMOY_RPC:-}
      TEST_USDT_ADDRESS: ${TEST_USDT_ADDRESS:-}
    volumes:
      - type: bind
        source: ${HANDOFF_DATA_DIR:?Set the private host data directory}
        target: /data
        bind:
          create_host_path: false
    secrets: [preview_worker_secret]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0700
    networks: [gateway, scanner, preview]
    depends_on:
      scanner:
        condition: service_healthy
      preview-worker:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4003/api/ready',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  media-image:
    image: handoff-media:${HANDOFF_RELEASE:-preview}
    build:
      context: ..
      dockerfile: Dockerfile.media
    entrypoint: [node, -e, "process.exit(0)"]
    restart: "no"
    network_mode: none
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
  preview-worker:
    image: handoff-preview-worker:${HANDOFF_RELEASE:-preview}
    build:
      context: ..
      dockerfile: Dockerfile
      target: preview-worker
    init: true
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    group_add: ["${HANDOFF_DOCKER_GID:?Set the host Docker socket group ID}"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 96
    mem_limit: 384m
    cpus: 0.5
    environment:
      NODE_ENV: production
      PREVIEW_WORKER_HOST: 0.0.0.0
      PREVIEW_WORKER_PORT: "4004"
      PREVIEW_WORKER_SECRET_FILE: /run/secrets/preview_worker_secret
      HANDOFF_MEDIA_IMAGE: handoff-media:${HANDOFF_RELEASE:-preview}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets: [preview_worker_secret]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000,mode=0700
    networks: [preview]
    depends_on:
      media-image:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, /app/worker-health.mjs]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  scanner:
    image: handoff-scanner:${HANDOFF_RELEASE:-preview}
    build:
      context: ..
      dockerfile: Dockerfile.scanner
    platform: linux/amd64
    restart: unless-stopped
    pids_limit: 96
    mem_limit: 2g
    cpus: 1
    volumes:
      - definitions:/var/lib/clamav
    networks: [scanner, updates]
    healthcheck:
      test: [CMD, clamdscan, --config-file=/etc/clamav/clamd.conf, --ping=1]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  gateway:
    image: handoff-gateway:${HANDOFF_RELEASE:-preview}
    build:
      context: ../../frontend
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    expose: ["8080"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=1000,gid=1000,mode=0700
    networks: [gateway]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  gateway:
  scanner:
    internal: true
  preview:
    internal: true
  updates:
volumes:
  definitions:
secrets:
  preview_worker_secret:
    file: ${HANDOFF_SECRETS_DIR:?Set the host secret directory}/preview_worker_secret
