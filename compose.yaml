name: handoff-local
services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    image: handoff-scanner:local
    platform: linux/amd64
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - definitions:/var/lib/clamav
    mem_limit: 2g
    cpus: 1
    restart: "no"
    healthcheck:
      test: [CMD, clamdscan, --config-file=/etc/clamav/clamd.conf, --ping=1]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 180s
volumes:
  definitions:
